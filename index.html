<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>Japanese Quiz · Day 3</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --surface-2: #f3efe7;
    --ink: #1d1a16;
    --ink-2: #57534a;
    --line: #e3ddd2;
    --accent: #b3372e;
    --accent-ink: #ffffff;
    --accent-soft: #f7e8e6;
    --ok: #1d7a3a;
    --ok-soft: #e4f2e7;
    --bad: #b3372e;
    --bad-soft: #f9e9e7;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f;
      --surface: #232019;
      --surface-2: #2b2820;
      --ink: #f2eee4;
      --ink-2: #b3ac9c;
      --line: #403b30;
      --accent: #e0685c;
      --accent-ink: #1c0f0d;
      --accent-soft: #3a2320;
      --ok: #6fce8a;
      --ok-soft: #1f3226;
      --bad: #e0685c;
      --bad-soft: #3a2320;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }
  header { padding: 8px 2px 4px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 6px; font-weight: 800; letter-spacing: 0.01em; }
  h1 .day { color: var(--accent); }
  .meta { color: var(--ink-2); font-size: 14px; margin: 0 0 10px; }
  .howto {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 15px;
    margin-bottom: 18px;
  }
  .progressbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 10px 0 8px;
  }
  .progress-label { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .track { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: var(--accent); transition: width .25s ease; }
  section.group { margin-top: 26px; }
  h2.group-title {
    font-size: 19px; margin: 0 0 12px; padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  .passage {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 17px;
    margin-bottom: 16px;
  }
  .passage p { margin: 0; }
  .q {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
  .q-num {
    flex: none; font-weight: 800; font-size: 14px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 8px; padding: 2px 9px;
  }
  .q-text { font-size: 17px; font-weight: 600; }
  .q-mark { margin-left: auto; flex: none; font-weight: 800; font-size: 15px; }
  .q-mark.right { color: var(--ok); }
  .q-mark.wrong { color: var(--bad); }
  .opts { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 16.5px; color: var(--ink);
    cursor: pointer; font-family: inherit; line-height: 1.5;
    min-height: 52px;
    -webkit-tap-highlight-color: transparent;
  }
  .opt .letter {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--ink-2);
  }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt.selected .letter { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .letter { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }
  .opt.incorrect .letter { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt:disabled { cursor: default; opacity: 1; }
  .explain {
    display: none;
    margin-top: 12px; padding: 11px 13px;
    background: var(--surface-2); border-radius: 10px;
    font-size: 14.5px; color: var(--ink);
  }
  .explain .ans { font-weight: 800; }
  .explain.show { display: block; }
  .actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  button.main {
    flex: 1 1 200px;
    border: none; border-radius: 12px;
    padding: 16px; font-size: 17px; font-weight: 800;
    background: var(--accent); color: var(--accent-ink);
    cursor: pointer; font-family: inherit;
    min-height: 56px;
  }
  button.main:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    flex: 0 1 160px;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 16px; font-size: 16px; font-weight: 700;
    background: var(--surface); color: var(--ink);
    cursor: pointer; font-family: inherit;
    min-height: 56px;
  }
  .result {
    display: none;
    margin-top: 24px;
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 22px 18px;
    text-align: center;
  }
  .result.show { display: block; }
  .result .score { font-size: 44px; font-weight: 800; line-height: 1.1; }
  .result .score small { font-size: 20px; color: var(--ink-2); }
  .result .band { font-size: 19px; font-weight: 700; margin-top: 8px; }
  .result .note { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
  .warn { color: var(--bad); font-size: 14px; font-weight: 700; margin-top: 10px; min-height: 1.4em; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Japanese Quiz · <span class="day">Day 3</span></h1>
    <p class="meta">2026-10-26 · JLPT N1 级别 · 共 20 题 · 话题：科技与社会（自动驾驶与社会变化）</p>
    <div class="howto">点选每题答案，全部选完后点「提交批改」。建议限时 20 分钟。</div>
  </header>

  <div class="progressbar">
    <div class="progress-label"><span>答题进度</span><span id="progressText">已答 0/20</span></div>
    <div class="track"><div class="fill" id="progressFill"></div></div>
  </div>

  <main id="quiz"></main>

  <div class="result" id="result">
    <div class="score"><span id="scoreNum">0</span><small> / 20</small></div>
    <div class="band" id="bandText"></div>
    <div class="note">JLPT 级别为粗估，仅供参考。</div>
  </div>

  <div class="warn" id="warn"></div>
  <div class="actions">
    <button class="main" id="submitBtn" type="button">提交批改</button>
    <button class="ghost" id="resetBtn" type="button">再来一次</button>
  </div>
</div>

<script>
var PASSAGE = "自動運転技術の実用化が進み、都市の交通は大きく変わりつつある。事故の減少や高齢者の移動支援が期待される一方、事故時の責任の所在や、運転という仕事の喪失といった課題も顕在化している。技術の進歩に即した法整備と社会の合意形成が、普及の鍵を握ると言えるだろう。";

var GROUPS = [
  { title: "文字・語彙", questions: [
    { q: "他の社員は曖昧な態度を取った。「曖昧」の意味はどれか。", opts: ["はっきりしない", "厳しい", "慎重な", "積極的な"], ans: 0, exp: "「曖昧」指含糊、不明确。" },
    { q: "改善の効果は顕著だった。「顕著」の意味はどれか。", opts: ["目立って明らかな", "わずかな", "一時的な", "予想外の"], ans: 0, exp: "「顕著」指显著、明显。" },
    { q: "新しい法律が来月施行される。「施行」の意味はどれか。", opts: ["廃止される", "実施される", "検討される", "延期される"], ans: 1, exp: "「施行」指法律等开始实施。" },
    { q: "彼はチームの責任を担うことになった。「担う」の意味はどれか。", opts: ["避ける", "引き受ける", "分担して逃れる", "批判する"], ans: 1, exp: "「担う」指承担责任或角色。" },
    { q: "感染の拡大を抑制する措置が取られた。「抑制」の意味はどれか。", opts: ["促進する", "無視する", "抑え込む", "記録する"], ans: 2, exp: "「抑制」指压制、控制。" },
    { q: "彼の言葉から本音を垣間見た。「垣間見る」の意味はどれか。", opts: ["じっくり観察する", "ちらっと見てうかがう", "見落とす", "見せびらかす"], ans: 1, exp: "「垣間見る」指偶然瞥见、窥见一斑。" },
    { q: "政策が普及に拍車をかけた。「拍車をかける」の意味はどれか。", opts: ["勢いをさらに増す", "妨げる", "始める", "終わらせる"], ans: 0, exp: "「拍車をかける」指加速推进势头。" }
  ]},
  { title: "文法", questions: [
    { q: "人手不足が深刻化し、企業は賃上げに踏み切ら（　）なった。", opts: ["ざるを得ず", "ざるをえず", "ざるを得なく", "ざるを得ないで"], ans: 2, exp: "「ざるを得ない」表示不得不，这里用「ざるを得なくなった」表示变得不得不做。" },
    { q: "世間の批判を（　）、彼は独自の開発方針を貫いた。", opts: ["よそに", "そばに", "うちに", "かぎりに"], ans: 0, exp: "「～をよそに」表示不顾、不理会。" },
    { q: "彼は研究をする（　）、大学で非常勤講師も務めている。", opts: ["かたわら", "ついでに", "ばかりに", "ながらに"], ans: 0, exp: "「～かたわら」表示在做某事的同时还做另一件事。" },
    { q: "制度は現場の実情に（　）見直すべきだ。", opts: ["即して", "際して", "対して", "関して"], ans: 0, exp: "「～に即して」表示依照、根据。" },
    { q: "東京を（　）、全国で自動運転の実証実験が始まった。", opts: ["皮切りに", "きっかけに", "はじめに", "もとに"], ans: 0, exp: "「～を皮切りに」表示以……为开端。" },
    { q: "彼の言い訳は聞くに（　）ものだった。", opts: ["堪えない", "堪えられない", "堪えざる", "堪えにくい"], ans: 0, exp: "「聞くに堪えない」是固定表达，表示不堪入耳。" },
    { q: "この味はこの店（　）のものだ。", opts: ["ならでは", "ならではの", "ならではに", "ならではで"], ans: 1, exp: "「～ならではの」表示唯有……才有的、独特的。" }
  ]},
  { title: "読解", passage: PASSAGE, questions: [
    { q: "筆者が最も伝えたいことは何か。", opts: ["技術さえ進めば普及は自然に進む", "事故は完全になくなる", "法整備と社会の合意が普及の成否を左右する", "高齢者は自動運転を使うべきではない"], ans: 2, exp: "文末指出法整备与社会共识是普及的关键。" },
    { q: "自動運転に期待される効果として本文に挙げられているものはどれか。", opts: ["交通費の大幅削減", "事故の減少と高齢者の移動支援", "運転手の賃金上昇", "都市の人口増加"], ans: 1, exp: "文中明确提到事故减少与高龄者出行支援。" },
    { q: "本文が課題として挙げているものはどれか。", opts: ["技術の開発費用が高いこと", "事故時の責任の所在と運転職の喪失", "高齢者が車を買えないこと", "都市の道路が狭いこと"], ans: 1, exp: "文中指出责任归属与驾驶工作消失是显现的课题。" },
    { q: "「普及の鍵を握る」の意味に最も近いものはどれか。", opts: ["普及を妨げる", "普及の成否を左右する", "普及を急ぐ", "普及を記録する"], ans: 1, exp: "「鍵を握る」表示掌握成败的关键。" },
    { q: "「顕在化している」の意味に最も近いものはどれか。", opts: ["はっきりと現れてきている", "隠れてきている", "一時的に消えている", "予想されているだけである"], ans: 0, exp: "「顕在化」指问题明显地浮现出来。" },
    { q: "筆者の姿勢として最も適切なものはどれか。", opts: ["技術の進歩だけを楽観視している", "課題を無視して推進すべきだとしている", "技術と社会の両面から慎重に進めるべきだとしている", "自動運転の普及に反対している"], ans: 2, exp: "笔者既谈期待也谈课题，主张兼顾法制与共识，态度是谨慎推进。" }
  ]}
];

var LETTERS = ["A", "B", "C", "D"];
var total = 0;
GROUPS.forEach(function(g){ total += g.questions.length; });

var answers = {}; // "gi-qi" -> selected index
var submitted = false;

var quizEl = document.getElementById("quiz");
var progressText = document.getElementById("progressText");
var progressFill = document.getElementById("progressFill");
var resultEl = document.getElementById("result");
var scoreNum = document.getElementById("scoreNum");
var bandText = document.getElementById("bandText");
var warnEl = document.getElementById("warn");
var submitBtn = document.getElementById("submitBtn");
var resetBtn = document.getElementById("resetBtn");

function key(gi, qi) { return gi + "-" + qi; }

function render() {
  quizEl.innerHTML = "";
  var n = 0;
  GROUPS.forEach(function(group, gi) {
    var sec = document.createElement("section");
    sec.className = "group";
    var h = document.createElement("h2");
    h.className = "group-title";
    h.textContent = group.title;
    sec.appendChild(h);
    if (group.passage) {
      var p = document.createElement("div");
      p.className = "passage";
      var pp = document.createElement("p");
      pp.textContent = group.passage;
      p.appendChild(pp);
      sec.appendChild(p);
    }
    group.questions.forEach(function(item, qi) {
      n++;
      var card = document.createElement("div");
      card.className = "q";
      card.id = "card-" + key(gi, qi);
      var head = document.createElement("div");
      head.className = "q-head";
      var num = document.createElement("span");
      num.className = "q-num";
      num.textContent = "Q" + n;
      var txt = document.createElement("span");
      txt.className = "q-text";
      txt.textContent = item.q;
      var mark = document.createElement("span");
      mark.className = "q-mark";
      mark.id = "mark-" + key(gi, qi);
      head.appendChild(num);
      head.appendChild(txt);
      head.appendChild(mark);
      card.appendChild(head);
      var opts = document.createElement("div");
      opts.className = "opts";
      item.opts.forEach(function(optText, oi) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt";
        b.id = "opt-" + key(gi, qi) + "-" + oi;
        var letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = LETTERS[oi];
        var label = document.createElement("span");
        label.textContent = optText;
        b.appendChild(letter);
        b.appendChild(label);
        b.addEventListener("click", function() { select(gi, qi, oi); });
        opts.appendChild(b);
      });
      card.appendChild(opts);
      var exp = document.createElement("div");
      exp.className = "explain";
      exp.id = "exp-" + key(gi, qi);
      exp.innerHTML = "";
      var ansSpan = document.createElement("span");
      ansSpan.className = "ans";
      ansSpan.textContent = "正确答案：" + LETTERS[item.ans] + "。";
      exp.appendChild(ansSpan);
      exp.appendChild(document.createTextNode(item.exp));
      card.appendChild(exp);
      sec.appendChild(card);
    });
    quizEl.appendChild(sec);
  });
  updateProgress();
}

function select(gi, qi, oi) {
  if (submitted) return;
  answers[key(gi, qi)] = oi;
  var item = GROUPS[gi].questions[qi];
  for (var i = 0; i < item.opts.length; i++) {
    var el = document.getElementById("opt-" + key(gi, qi) + "-" + i);
    if (el) el.classList.toggle("selected", i === oi);
  }
  warnEl.textContent = "";
  updateProgress();
}

function answeredCount() {
  return Object.keys(answers).length;
}

function updateProgress() {
  var c = answeredCount();
  progressText.textContent = "已答 " + c + "/" + total;
  progressFill.style.width = (total ? (c / total * 100) : 0) + "%";
}

function bandFor(score) {
  if (score >= 18) return "N1 合格水準";
  if (score >= 14) return "N1 に近い";
  if (score >= 10) return "N2 水準";
  return "要加强基础";
}

function submit() {
  if (submitted) return;
  var c = answeredCount();
  if (c < total) {
    warnEl.textContent = "还有 " + (total - c) + " 题未答，全部选完后才能提交批改。";
    return;
  }
  submitted = true;
  var score = 0;
  GROUPS.forEach(function(group, gi) {
    group.questions.forEach(function(item, qi) {
      var sel = answers[key(gi, qi)];
      var right = sel === item.ans;
      if (right) score++;
      var mark = document.getElementById("mark-" + key(gi, qi));
      mark.textContent = right ? "✓ 正确" : "✗ 错误";
      mark.className = "q-mark " + (right ? "right" : "wrong");
      for (var i = 0; i < item.opts.length; i++) {
        var el = document.getElementById("opt-" + key(gi, qi) + "-" + i);
        el.disabled = true;
        el.classList.remove("selected");
        if (i === item.ans) el.classList.add("correct");
        else if (i === sel) el.classList.add("incorrect");
      }
      document.getElementById("exp-" + key(gi, qi)).classList.add("show");
    });
  });
  scoreNum.textContent = score;
  bandText.textContent = "JLPT 粗估：" + bandFor(score);
  resultEl.classList.add("show");
  submitBtn.disabled = true;
  resultEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function reset() {
  answers = {};
  submitted = false;
  submitBtn.disabled = false;
  resultEl.classList.remove("show");
  warnEl.textContent = "";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

submitBtn.addEventListener("click", submit);
resetBtn.addEventListener("click", reset);
render();
</script>
</body>
</html>
